---
- name: Disable SELinux temporarily
  command: setenforce 0

- name: Disable SELinux permanently
  lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX=enforcing$'
    line: 'SELINUX=permissive'

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Stop firewalld service
  service:
    name: firewalld
    state: stopped
- name: Disable firewalld service
  service:
    name: firewalld
    enabled: no

- name: Load necessary kernel modules for containerd
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/containerd.conf

- name: Load kernel modules
  command: modprobe overlay && modprobe br_netfilter

- name: Configure sysctl for Kubernetes networking
  copy:
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    dest: /etc/sysctl.d/99-kubernetes-cri.conf

- name: Apply sysctl settings
  command: sysctl --system

- name: Disable swap
  command: swapoff -a

- name: Loại bỏ swap từ /etc/fstab để tắt vĩnh viễn
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(.*swap.*)$'
    replace: '# \1'

- name: Reload fstab để áp dụng thay đổi
  ansible.builtin.command: mount -a

# Thêm các node vào /etc/hosts từ inventory nếu chưa tồn tại
- name: Add master and worker nodes to /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
    state: present
    create: yes
  loop: "{{ groups['all'] }}"
  when: 
    - hostvars[item].ansible_host is defined
    - "'{{ hostvars[item].ansible_host }} {{ item }}' not in lookup('file', '/etc/hosts')"
