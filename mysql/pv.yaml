apiVersion: v1
kind: PersistentVolume
metadata:
  name: iam-esb-db-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /nfs/database
    server: 192.168.1.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iam-esb-db-pvc
  namespace: demo
spec:
  volumeName: iam-esb-db-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
