image:
  repository: riseofkingdoms20211/webhook-alert-gapo
  tag: 0.2.7-idle-log-throttle-guard
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5051

resources: {}

env: {}

templates:
  # Inline template content for alert_template.html; leave empty to use image default
  alert_template_html: |
    🔥 **{{ alert_name }}**
    {% if summary %}📝 {{ summary }}{% endif %}
    {% if description %}📄 {{ description }}{% endif %}
    🏷️ {{ routing_label|title }}: {{ routing_value }}

    {% set keys = ['namespace','service','job','instance','severity'] %}
    {% for key, value in labels.items() %}
    {% if key != routing_label and key in keys %}
    🔖 {{ key|title }}: {{ value }}
    {% endif %}
    {% endfor %}

ConfigMap:
  # Logging
  LOG_LEVEL: "INFO"
  LOG_TO_STDOUT: "true"
  LOG_TO_FILE: "false"
  LOG_FILE_PATH: "alert_router.log"
  LOG_MAX_BYTES: "10485760"
  LOG_BACKUP_COUNT: "5"
  LOG_ALERT_DETAILS: "true"
  # Webhook/API
  ALERTMANAGER_ENDPOINT: "/alertmanager"
  IS_PRODUCTION: "false"
  WEBHOOK_SIGNATURE_HEADER: "x-hub-signature"

  # Rate limiting
  RATE_LIMIT: "100 per minute"
  LIMITER_STORAGE: "memory://"

  # Payload and queue
  MAX_CONTENT_LENGTH: "1048576"
  MAX_QUEUE_SIZE: "1000"
  WORKER_THREADS: "4"
  QUEUE_PUT_TIMEOUT: "2"

  # Routing
  ROUTING_LABEL: "namespace"
  ALLOWED_VALUES: "monitoring"

  # Defaults for Gapo chat
  DEFAULT_COLLAB_ID: "7006773268721666048"
  DEFAULT_BOT_ID: "5847077221700892984"
  DEFAULT_RECEIVER_ID: "1074278932"

  # Gapo send
  GAPO_API_URL: "http://10.6.131.11:8082/webhooktest4pt/chatbot/alert-bot"

  # Runtime toggles
  TEST_GAPO_ON_STARTUP: "false"
  DEBUG: "false"
  PORT: "5051"
  GUNICORN_BIND: "0.0.0.0:5051"
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"
  GUNICORN_TIMEOUT: "120"
  GUNICORN_WORKER_CLASS: "gthread"
  TZ: "Asia/Ho_Chi_Minh"

  # Security controls
  WEBHOOK_IP_WHITELIST: ""  # e.g. "10.0.0.0/8,192.168.1.10"
  SECURITY_HEADERS_ENABLED: "true"
  HSTS_ENABLED: "true"
  TEMPLATE_DIR: "/app/templates"

Secret:
  WEBHOOK_TOKEN: "supersecret"
  WEBHOOK_SIGNATURE_SECRET: ""
  GAPO_SIGNATURE: "YXBwX3NlY3JlY3Rfc2Fwb18yMDIz"
  ADMIN_MFA_TOTP_SECRET: ""

alertmanagerConfigs:
  enabled: true
  selectorLabel: alertmanager
  alertmanagerName: main
  webhookURL: http://webhook-alert-gapo-webhook-alert-gapo.monitoring.svc.cluster.local:5051/alertmanager
  bearer:
    enabled: true
    token: "supersecret"
    systemRegex: ^(monitoring)$
    groupBy: [alertname, namespace, job]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  items:
    - name: monitoring
      namespace: monitoring
      whitelist:
        instances:
          ipRegex: ".*"
          hostRegex: ".*"
        severities: [critical, warning]
        jobs: []
        alertnames: []
      blacklist:
        alertnames: [Watchdog, InfoInhibitor]

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header X-XSS-Protection "0" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  hosts:
    - host: webhook-alert-gapo.local
      paths:
          pathType: Prefix
  tls: []

serviceAccount:
  create: false

podSecurityContext:
  enabled: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  enabled: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: false
  ingress:
    fromNamespaces:
      - kube-system
      - monitoring
    fromCIDRs:
      - 10.0.0.0/8
    ports:
      - 80
      - 443
      - 5051
  egress:
    toCIDRs:
      - 10.0.0.0/8
    toNamespaces:
      - kube-system
      - monitoring
    ports:
      - 443
      - 80

probes:
  enabled: false
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20