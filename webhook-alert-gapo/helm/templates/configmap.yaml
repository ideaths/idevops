apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webhook-alert-gapo.fullname" . }}-env
  labels:
    app.kubernetes.io/name: {{ include "webhook-alert-gapo.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ include "webhook-alert-gapo.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  {{- $secretKeys := list "WEBHOOK_TOKEN" "WEBHOOK_SIGNATURE_SECRET" "SECRET_KEY" "GAPO_SIGNATURE" }}
  {{- $hasTopLevelSplit := or (hasKey .Values "ConfigMap") (hasKey .Values "Secret") }}
  {{- $hasEnvSplit := and .Values.env (or (hasKey .Values.env "ConfigMap") (hasKey .Values.env "Secret")) }}
  {{- if .Values.ConfigMap }}
  {{- range $key, $val := .Values.ConfigMap }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- else if and .Values.env .Values.env.ConfigMap }}
  {{- range $key, $val := .Values.env.ConfigMap }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- else if and .Values.env (not $hasTopLevelSplit) (not $hasEnvSplit) }}
  {{- range $key, $val := .Values.env }}
  {{- if not (has $key $secretKeys) }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  {{- end }}