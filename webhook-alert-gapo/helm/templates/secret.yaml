apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webhook-alert-gapo.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "webhook-alert-gapo.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ include "webhook-alert-gapo.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- $secretKeys := list "WEBHOOK_TOKEN" "WEBHOOK_SIGNATURE_SECRET" "SECRET_KEY" "GAPO_SIGNATURE" }}
  {{- $hasTopLevelSplit := or (hasKey .Values "ConfigMap") (hasKey .Values "Secret") }}
  {{- $hasEnvSplit := and .Values.env (or (hasKey .Values.env "ConfigMap") (hasKey .Values.env "Secret")) }}
  {{- if .Values.Secret }}
  {{- range $key, $val := .Values.Secret }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- else if and .Values.env .Values.env.Secret }}
  {{- range $key, $val := .Values.env.Secret }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- else if and .Values.env (not $hasTopLevelSplit) (not $hasEnvSplit) }}
  {{- range $key, $val := .Values.env }}
  {{- if (has $key $secretKeys) }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
---
{{- if and .Values.alertmanagerConfigs.enabled (.Values.alertmanagerConfigs.bearer) }}
{{- $globalToken := default "" .Values.alertmanagerConfigs.bearer.token }}
{{- range $i, $item := .Values.alertmanagerConfigs.items }}
{{- $itemToken := default $globalToken $item.bearerToken }}
{{- if ne (default "" $itemToken) "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-am-bearer-%s" (include "webhook-alert-gapo.fullname" $) $item.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $item.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "webhook-alert-gapo.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ include "webhook-alert-gapo.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  token: {{ $itemToken | b64enc }}
---
{{- end }}
{{- end }}
{{- end }}