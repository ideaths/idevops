---
- name: Install required packages for container runtime
  dnf:
    name:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
      - iscsi-initiator-utils
    state: present

- name: Check if Docker repository file exists
  stat:
    path: /etc/yum.repos.d/docker-ce.repo
  register: docker_repo

- name: Add Docker repository for containerd
  get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  when: not docker_repo.stat.exists

- name: Check if containerd is installed
  dnf:
    name: containerd.io
    state: present
  register: containerd_installed
  ignore_errors: yes

- name: Install containerd
  dnf:
    name: containerd.io
    state: present
  when: containerd_installed is not defined or containerd_installed.failed

- name: Create containerd configuration directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd configuration file
  command: containerd config default > /etc/containerd/config.toml

- name: Comment out disabled_plugins = ["cri"]
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^disabled_plugins = \["cri"\]'
    line: '# disabled_plugins = ["cri"]'
    state: present
    backup: yes

- name: Enable and start containerd
  systemd:
    name: containerd
    enabled: yes
    state: started

- name: Check if Kubernetes repository file exists
  stat:
    path: /etc/yum.repos.d/kubernetes.repo
  register: kubernetes_repo

- name: Add Kubernetes repository
  copy:
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/{{ kube_version }}/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/{{ kube_version }}/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni
    dest: /etc/yum.repos.d/kubernetes.repo
    mode: '0644'
  when: not kubernetes_repo.stat.exists

- name: Install Kubernetes components and other required packages
  dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
      - keepalived
    state: present
    disable_excludes: kubernetes

- name: Check if Helm is installed
  stat:
    path: /usr/local/bin/helm
  register: helm_installed

- name: Install Helm using script from GitHub
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: '0755'
  when: not helm_installed.stat.exists

- name: Execute Helm installation script
  command: /tmp/get-helm-3.sh
  when: not helm_installed.stat.exists
  args:
    creates: /usr/local/bin/helm
