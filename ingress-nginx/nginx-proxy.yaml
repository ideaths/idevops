apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: cds
  labels:
    app: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 1
  template:
    metadata:
      namespace: cds
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
          - containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: confnginx
---
kind: Service
apiVersion: v1
metadata:
  name: nginx-custom
  namespace: cds
spec:
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 443
    targetPort: 443
    name: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-nginx-custom
  namespace: cds
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
  - hosts:
    - bdw.demozone.vn
    secretName: cds-secret
  - hosts:
    - bi.demozone.vn
    secretName: cds-secret
  - hosts:
    - eform.demozone.vn
    secretName: cds-secret

  rules:
  - host: 'bi.demozone.vn'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-custom
            port:
              number: 443
  - host: 'eform.demozone.vn'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-custom
            port:
              number: 443

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: confnginx
  namespace: cds
data:
  nginx.conf: |
    user  nginx;
    worker_processes  1;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
      access_log  /var/log/nginx/access.log  main;
      sendfile        on;
      keepalive_timeout  65;
      server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
      }
      server {
        listen 443;
        server_name bi.demozone.vn;
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;
        location / {
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_pass https://10.2.65.27;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
        }
      }
      server {
        listen 443;
        server_name eform.demozone.vn;
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;
        location / {
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_pass https://10.2.65.27;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
        }
      }
      server {
        listen 443;
        server_name bdw.demozone.vn;
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;
        location / {
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_pass https://10.2.65.163:8443;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
        }
      }

    }